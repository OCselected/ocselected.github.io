<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursive Cognitive Cycle — System Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020617;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: 'JetBrains Mono', monospace;
  }
  .container {
    width: 1200px; height: 850px; position: relative;
    background: #020617;
    border: 1px solid #1e293b; border-radius: 16px;
    overflow: hidden;
  }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="container">
<svg viewBox="0 0 1200 850">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#a78bfa"/>
    </marker>

    <!-- Signal wave -->
    <pattern id="signal" width="60" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q15,0 30,10 T60,10" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#grid)"/>

  <!-- Header -->
  <text x="600" y="45" text-anchor="middle" font-size="18" font-weight="700" fill="#e2e8f0" letter-spacing="3">
    RECURSIVE COGNITIVE CYCLE
  </text>
  <text x="600" y="65" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2">
    SYSTEM ARCHITECTURE — v1.0
  </text>
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#1e293b" stroke-width="1"/>

  <!-- ======== ARROWS ======== -->

  <!-- Top → Right (INTENT → BOUNDARY) -->
  <path d="M 680,200 L 950,200" stroke="#22d3ee" stroke-width="2.5" fill="none"
        marker-end="url(#arrow-cyan)" filter="url(#glow-cyan)"/>
  <text x="815" y="190" text-anchor="middle" font-size="10" fill="#22d3ee" font-weight="400">
    articulates intent
  </text>
  <text x="815" y="220" text-anchor="middle" font-size="8" fill="#475569">
    [specification signal]
  </text>

  <!-- Right → Bottom (BOUNDARY → EXECUTION) -->
  <path d="M 1050,480 L 1050,680" stroke="#34d399" stroke-width="2.5" fill="none"
        marker-end="url(#arrow-green)" filter="url(#glow-green)"/>
  <text x="1060" y="585" text-anchor="middle" font-size="10" fill="#34d399" font-weight="400"
        transform="rotate(90, 1060, 585)">
    delegates execution
  </text>

  <!-- Bottom → Left (EXECUTION → EXTENDED) -->
  <path d="M 680,780 L 250,780 L 250,480" stroke="#fbbf24" stroke-width="2.5" fill="none"
        marker-end="url(#arrow-amber)" filter="url(#glow-amber)"/>
  <text x="465" y="790" text-anchor="middle" font-size="10" fill="#fbbf24" font-weight="400">
    produces output
  </text>
  <text x="465" y="810" text-anchor="middle" font-size="8" fill="#475569">
    [artifacts + insights + novel patterns]
  </text>

  <!-- Left → Top (EXTENDED → INTENT) — feedback loop -->
  <path d="M 150,200 L 150,200" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-dasharray="6,4"
        marker-end="url(#arrow-violet)" filter="url(#glow-violet)"/>
  <path d="M 150,380 L 150,200" stroke="#a78bfa" stroke-width="2.5" fill="none" stroke-dasharray="6,4"
        marker-end="url(#arrow-violet)" filter="url(#glow-violet)"/>
  <text x="140" y="295" text-anchor="end" font-size="10" fill="#a78bfa" font-weight="400"
        transform="rotate(-90, 140, 295)">
    transforms cognition
  </text>
  <text x="140" y="310" text-anchor="end" font-size="8" fill="#475569"
        transform="rotate(-90, 140, 310)">
    [recursive feedback]
  </text>

  <!-- ======== NODES ======== -->

  <!-- NODE 1: INTENT (Top) -->
  <rect x="250" y="120" width="430" height="160" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <rect x="250" y="120" width="430" height="160" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.3"/>
  <text x="465" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#22d3ee" letter-spacing="2">
    [INTENT]
  </text>
  <text x="465" y="175" text-anchor="middle" font-size="10" fill="#94a3b8">
    The user's direction, value judgment, intuition
  </text>
  <line x1="280" y1="190" x2="650" y2="190" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="465" y="210" text-anchor="middle" font-size="9" fill="#64748b">
    "I want to explore this question"
  </text>
  <text x="465" y="228" text-anchor="middle" font-size="9" fill="#64748b">
    "This matters because..."
  </text>
  <text x="465" y="246" text-anchor="middle" font-size="9" fill="#64748b">
    "Something feels off about this framework"
  </text>
  <text x="465" y="268" text-anchor="middle" font-size="8" fill="#475569">
    │ intent density determines output quality │
  </text>

  <!-- Signal wave on top of intent -->
  <path d="M250,130 Q280,120 310,130 T370,130 T430,130 T490,130 T550,130 T610,130 T670,130" 
        fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- NODE 2: BOUNDARY (Right) -->
  <rect x="950" y="280" width="200" height="120" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="1050" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399" letter-spacing="2">
    [BOUNDARY]
  </text>
  <text x="1050" y="338" text-anchor="middle" font-size="9" fill="#94a3b8">
    Current capability limit
  </text>
  <text x="1050" y="358" text-anchor="middle" font-size="9" fill="#64748b">
    "I can't do this alone"
  </text>
  <text x="1050" y="378" text-anchor="middle" font-size="9" fill="#64748b">
    "This is beyond my execution scope"
  </text>

  <!-- NODE 3: EXECUTION (Bottom) -->
  <rect x="250" y="680" width="430" height="160" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="465" y="715" text-anchor="middle" font-size="14" font-weight="700" fill="#fbbf24" letter-spacing="2">
    [EXECUTION — AGENT]
  </text>
  <text x="465" y="735" text-anchor="middle" font-size="10" fill="#94a3b8">
    Hermes Agent: search, synthesize, write, iterate
  </text>
  <line x1="280" y1="750" x2="650" y2="750" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="465" y="770" text-anchor="middle" font-size="9" fill="#64748b">
    web_search → web_extract → read_file → write_file
  </text>
  <text x="465" y="788" text-anchor="middle" font-size="9" fill="#64748b">
    delegate_task → patch → terminal
  </text>
  <text x="465" y="810" text-anchor="middle" font-size="8" fill="#475569">
    │ tool chain: composition of primitive operations │
  </text>

  <!-- NODE 4: EXTENDED HORIZON (Left) -->
  <rect x="50" y="280" width="200" height="120" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5" filter="url(#glow-violet)"/>
  <text x="150" y="315" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa" letter-spacing="2">
    [EXTENDED]
  </text>
  <text x="150" y="338" text-anchor="middle" font-size="9" fill="#94a3b8">
    Newly accessible territory
  </text>
  <text x="150" y="358" text-anchor="middle" font-size="9" fill="#64748b">
    "I didn't know this existed"
  </text>
  <text x="150" y="378" text-anchor="middle" font-size="9" fill="#64748b">
    "This changes my understanding"
  </text>

  <!-- ======== CENTER CORE ======== -->
  <circle cx="465" cy="430" r="60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="465" cy="430" r="45" fill="rgba(30,41,59,0.5)" stroke="#64748b" stroke-width="1"/>
  <circle cx="465" cy="430" r="30" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Center text -->
  <text x="465" y="420" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0" letter-spacing="1">
    RECURSIVE
  </text>
  <text x="465" y="438" text-anchor="middle" font-size="10" font-weight="600" fill="#e2e8f0" letter-spacing="1">
    COUPLING
  </text>

  <!-- Center gear indicators -->
  <text x="445" y="455" font-size="8" fill="#475569">⚙</text>
  <text x="475" y="455" font-size="8" fill="#475569">⚙</text>

  <!-- ======== BOTTOM INFO PANEL ======== -->
  <line x1="100" y1="630" x2="1100" y2="630" stroke="#1e293b" stroke-width="1"/>

  <text x="600" y="655" text-anchor="middle" font-size="9" fill="#475569" letter-spacing="1">
    THE USER'S BOUNDARY IS NOT A WALL — IT IS THE CURRENT RADIUS OF THE KNOWN
  </text>

  <rect x="250" y="660" width="430" height="1" fill="#1e293b"/>

  <!-- Legend -->
  <text x="60" y="660" font-size="9" fill="#64748b" font-weight="600">LEGEND:</text>
  <rect x="60" y="668" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="78" y="678" font-size="8" fill="#94a3b8">Intent</text>
  <rect x="140" y="668" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="158" y="678" font-size="8" fill="#94a3b8">Boundary</text>
  <rect x="230" y="668" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="248" y="678" font-size="8" fill="#94a3b8">Execution</text>
  <rect x="320" y="668" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="338" y="678" font-size="8" fill="#94a3b8">Extended</text>
  <line x1="420" y1="674" x2="450" y2="674" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="456" y="678" font-size="8" fill="#94a3b8">Feedback</text>

  <!-- Footer -->
  <text x="600" y="830" text-anchor="middle" font-size="8" fill="#334155" letter-spacing="1">
    SYSTEM GENERATED 2026-07-06 · THE WAY OF OPEN SOURCE · ARCHITECTURE v1.0
  </text>
</svg>
</div>
</body>
</html>

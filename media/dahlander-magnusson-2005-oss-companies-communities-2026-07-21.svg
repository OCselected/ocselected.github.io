<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
<defs>
<filter id="s" x="-5%" y="-5%" width="110%" height="110%">
  <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1A1A1A" flood-opacity="0.06"/>
</filter>
</defs>
<rect width="600" height="800" rx="10" fill="#F5F0E8" filter="url(#s)"/>
<rect x="0" y="0" width="600" height="5" fill="#1B3B6B"/>
<circle cx="550" cy="50" r="130" fill="none" stroke="#1B3B6B" stroke-width="1.5" opacity="0.07"/>
<circle cx="560" cy="40" r="80" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.10"/>
<rect x="20" y="90" width="14" height="14" fill="none" stroke="#1B3B6B" stroke-width="2" opacity="0.10" transform="rotate(15, 27, 97)"/>
<rect x="40" y="65" width="72" height="22" rx="3" fill="#1B3B6B"/>
<text x="76" y="80" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#FFFFFF">PAPER</text>
<text x="560" y="80" text-anchor="end" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" fill="#555555" opacity="0.5">2026-07-21</text>
<text x="40" y="109" font-family="Georgia, Songti SC, Noto Serif CJK SC, serif" font-size="24" font-weight="900" fill="#1A1A1A">
  <tspan x="40" dy="0">Relationships between</tspan>
  <tspan x="40" dy="32">Open Source Software</tspan>
  <tspan x="40" dy="32">Companies and</tspan>
  <tspan x="40" dy="32">Communities</tspan>
</text>
<text x="40" y="251" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="12" fill="#555555">Linus Dahlander &amp; Mats G. Magnusson (2005)</text>
<line x1="40" y1="279" x2="222" y2="279" stroke="#1B3B6B" stroke-width="1.5" opacity="0.25"/>
<text x="40" y="301" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#1A1A1A">
  <tspan x="40" dy="0">企业进入开源世界时，与社区之间</tspan>
  <tspan x="40" dy="20">存在三种基本关系模式——共生（双</tspan>
  <tspan x="40" dy="20">赢）、共栖（单方受益但不伤害）、</tspan>
  <tspan x="40" dy="20">寄生（榨取）。Dahlander &amp;</tspan>
  <tspan x="40" dy="20">Magnusson 通过对北欧 OSS 企业的</tspan>
  <tspan x="40" dy="20">案例研究，首次系统建立了企业-社</tspan>
  <tspan x="40" dy="20">区关系的类型学框架，为理解 OSPO</tspan>
  <tspan x="40" dy="20">的战略定位提供了理论基础。</tspan>
</text>
<rect x="40" y="483" width="90" height="18" rx="2" fill="#1A1A1A" opacity="0.04"/>
<text x="85" y="496" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="9" font-weight="700" fill="#555555">KEY IDEAS</text>
<text x="40" y="511" font-family="-apple-system, PingFang SC, Helvetica Neue, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="11" fill="#1A1A1A">
  <tspan x="40" dy="0">• 共生型：企业与社区互惠共赢</tspan>
  <tspan x="40" dy="18">• 共栖型：企业受益但社区不损失</tspan>
  <tspan x="40" dy="18">• 寄生型：企业榨取社区却不回馈</tspan>
</text>
<rect x="420" y="742" width="140" height="22" rx="2" fill="none" stroke="#1B3B6B" stroke-width="1" opacity="0.12"/>
<text x="490" y="757" text-anchor="middle" font-family="Helvetica Neue, SF Pro Text, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1B3B6B" opacity="0.35">OSCAR · 开源之书·共读</text>
<rect x="0" y="796" width="600" height="4" fill="#1B3B6B" opacity="0.7"/>
</svg>
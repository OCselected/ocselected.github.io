name: Discussion → Discord
on:
  discussion:
    types: [created, answered]
  discussion_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "discussion" ]; then
            jq -n \
              --arg title "${{ github.event.discussion.title }}" \
              --arg url "${{ github.event.discussion.html_url }}" \
              --arg author "${{ github.event.discussion.user.login }}" \
              --arg body "${{ github.event.discussion.body }}" \
              '{content: "📢 **新讨论**：**[\($title)](\($url))**\n作者：\($author)\n\n\($body)"}' \
              | curl -H "Content-Type: application/json" -d @- $DISCORD_WEBHOOK
          else
            jq -n \
              --arg title "${{ github.event.discussion.title }}" \
              --arg url "${{ github.event.discussion.html_url }}" \
              --arg author "${{ github.event.comment.user.login }}" \
              --arg body "${{ github.event.comment.body }}" \
              '{content: "💬 **新评论**：[$\($title)](\($url))\n作者：\($author)\n\n\($body)"}' \
              | curl -H "Content-Type: application/json" -d @- $DISCORD_WEBHOOK
          fi
